
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid slice">

  <defs>
    <!-- COLORES -->
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0750bb"/>
      <stop offset=".5" stop-color="#45caff"/>
      <stop offset="1" stop-color="#0750bb"/>
    </linearGradient>

    <linearGradient id="brightTrace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087cff"/>
      <stop offset=".5" stop-color="#b5f2ff"/>
      <stop offset="1" stop-color="#168bff"/>
    </linearGradient>

    <radialGradient id="coreGradient">
      <stop offset="0" stop-color="#b9f4ff" stop-opacity=".9"/>
      <stop offset=".2" stop-color="#168bff" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#0750bb" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0750bb" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chip" x2="0" y2="1">
      <stop stop-color="#102746"/>
      <stop offset="1" stop-color="#030b18"/>
    </linearGradient>

    <!-- ILUMINACIÓN -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="9" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="coreGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <!-- NÚCLEO CENTRAL -->
    <radialGradient id="coreLight">
      <stop offset="0" stop-color="#d9faff" stop-opacity=".8"/>
      <stop offset=".25" stop-color="#35aaff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#087cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* CIRCUITOS PRINCIPALES */
    .circuit-flow {
      fill: none;
      stroke: url(#trace);
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .58;
    }

    .circuit-bright {
      fill: none;
      stroke: #168bff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .48;
      filter: url(#glow);
    }

    /* PULSOS DE ENERGÍA */
    .energy-pulse {
      fill: none;
      stroke: url(#brightTrace);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 90 910;
      stroke-dashoffset: 1000;
      filter: url(#strongGlow);
      animation: energyFlow 5s linear infinite;
    }

    .energy-pulse-fast {
      fill: none;
      stroke: #8ceaff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 4 28;
      filter: url(#glow);
      animation: fastFlow 2.5s linear infinite;
    }

    @keyframes energyFlow {
      0% {
        stroke-dashoffset: 1000;
        opacity: 0;
      }
      10% { opacity: 1; }
      80% { opacity: 1; }
      100% {
        stroke-dashoffset: -1000;
        opacity: 0;
      }
    }

    @keyframes fastFlow {
      to { stroke-dashoffset: -128; }
    }

    /* NÚCLEO CENTRAL */
    .core-aura {
      transform-box: fill-box;
      transform-origin: center;
      animation: corePulse 6s ease-in-out infinite;
    }

    .core-ring {
      fill: none;
      stroke: #38baff;
      stroke-width: 1.8;
      opacity: .4;
      transform-box: fill-box;
      transform-origin: center;
      animation: ringPulse 8s ease-in-out infinite;
    }

    @keyframes corePulse {
      0%, 100% {
        opacity: .35;
        transform: scale(.85);
      }
      50% {
        opacity: .9;
        transform: scale(1.15);
      }
    }

    @keyframes ringPulse {
      0%, 100% {
        opacity: .2;
        transform: scale(.9);
      }
      50% {
        opacity: .65;
        transform: scale(1.08);
      }
    }

    /* MICROCHIPS */
    .chip-energy {
      animation: chipPulse 4s ease-in-out infinite;
    }

    @keyframes chipPulse {
      0%, 100% {
        opacity: .65;
        filter: brightness(.9);
      }
      50% {
        opacity: 1;
        filter: brightness(1.8);
      }
    }

    /* CONTACTOS */
    .contact-energy {
      animation: contactPulse 2.8s ease-in-out infinite;
    }

    @keyframes contactPulse {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }

    /* DESTELLOS */
    .flash-point {
      fill: #c1f4ff;
      filter: url(#strongGlow);
      transform-box: fill-box;
      transform-origin: center;
      animation: flashPoint 2.2s ease-in-out infinite;
    }

    @keyframes flashPoint {
      0%, 100% {
        opacity: .12;
        transform: scale(.5);
      }
      45% {
        opacity: 1;
        transform: scale(2.2);
      }
    }

    /* PARTÍCULAS */
    .particle {
      fill: #72ceff;
      filter: url(#glow);
      transform-box: fill-box;
      transform-origin: center;
      animation: particlePulse 4s ease-in-out infinite;
    }

    .floating-particle {
      fill: #9beaff;
      filter: url(#strongGlow);
      animation: floatingLight 6s ease-in-out infinite;
    }

    @keyframes particlePulse {
      0%, 100% {
        opacity: .15;
        transform: scale(.7);
      }
      50% {
        opacity: 1;
        transform: scale(1.6);
      }
    }

    @keyframes floatingLight {
      0%, 100% {
        opacity: .1;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-20px);
      }
    }

    /* LUZ AMBIENTAL */
    .ambient-energy {
      animation: ambientPulse 8s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { opacity: .04; }
      50% { opacity: .22; }
      100% { opacity: .08; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>

  <!-- FONDO PROFUNDO -->
  <rect width="1920" height="1080" fill="#020812"/>

  <!-- ILUMINACIÓN CENTRAL -->
  <g class="core-aura">
    <circle cx="960" cy="540" r="330"
            fill="url(#coreGradient)" filter="url(#coreGlow)"/>
    <circle cx="960" cy="540" r="220"
            fill="url(#coreLight)" filter="url(#softGlow)"/>
  </g>

  <!-- CIRCUITOS DE PROFUNDIDAD -->
  <g fill="none" stroke="#1675d5" opacity=".2" stroke-width="1.5">
    <path d="M0 80H300V160H420L480 220H580"/>
    <path d="M1920 90H1620V170H1500L1440 230H1340"/>
    <path d="M0 1000H300V920H420L480 860H580"/>
    <path d="M1920 990H1620V910H1500L1440 850H1340"/>
    <path d="M500 0V100H600V170H680"/>
    <path d="M1420 0V100H1320V170H1240"/>
    <path d="M500 1080V980H600V910H680"/>
    <path d="M1420 1080V980H1320V910H1240"/>
    <path d="M0 540H160V600H260V660H360"/>
    <path d="M1920 540H1760V600H1660V660H1560"/>
  </g>

  <!-- CIRCUITOS PRINCIPALES -->
  <g class="circuit-flow">
    <path id="p1" pathLength="1000" d="M0 150H180V230H340V310H510V390H650"/>
    <path id="p2" pathLength="1000" d="M0 240H100V300H230V380H390"/>
    <path id="p3" pathLength="1000" d="M0 420H180V480H310V550H470"/>
    <path id="p4" pathLength="1000" d="M0 850H170V770H330V690H500V620H650"/>

    <path id="p5" pathLength="1000" d="M1920 150H1740V230H1580V310H1410V390H1270"/>
    <path id="p6" pathLength="1000" d="M1920 240H1820V300H1690V380H1530"/>
    <path id="p7" pathLength="1000" d="M1920 420H1740V480H1610V550H1450"/>
    <path id="p8" pathLength="1000" d="M1920 850H1750V770H1590V690H1420V620H1270"/>

    <path d="M300 0V130H390V210H500V280"/>
    <path d="M1620 0V130H1530V210H1420V280"/>
    <path d="M300 1080V950H390V870H500V800"/>
    <path d="M1620 1080V950H1530V870H1420V800"/>

    <path d="M650 0V100H730V190H800"/>
    <path d="M1270 0V100H1190V190H1120"/>
    <path d="M650 1080V980H730V890H800"/>
    <path d="M1270 1080V980H1190V890H1120"/>

    <path d="M180 230V340H260V410"/>
    <path d="M1740 230V340H1660V410"/>
    <path d="M330 690V600H410V540"/>
    <path d="M1590 690V600H1510V540"/>

    <path d="M510 390V460H600V510H700"/>
    <path d="M1410 390V460H1320V510H1220"/>
    <path d="M500 620V550H600V510"/>
    <path d="M1420 620V550H1320V510"/>
  </g>

  <!-- CIRCUITOS ADICIONALES -->
  <g class="circuit-bright">
    <path d="M0 320H130V370H260V430H350"/>
    <path d="M1920 320H1790V370H1660V430H1570"/>
    <path d="M0 700H140V650H270V590H390"/>
    <path d="M1920 700H1780V650H1650V590H1530"/>

    <path d="M420 0V70H520V130H590"/>
    <path d="M1500 0V70H1400V130H1330"/>
    <path d="M420 1080V1010H520V950H590"/>
    <path d="M1500 1080V1010H1400V950H1330"/>

    <path d="M800 0V90H860V150"/>
    <path d="M1120 0V90H1060V150"/>
    <path d="M800 1080V990H860V930"/>
    <path d="M1120 1080V990H1060V930"/>

    <path d="M700 300H790V360H870V420"/>
    <path d="M1220 300H1130V360H1050V420"/>
    <path d="M700 780H790V720H870V660"/>
    <path d="M1220 780H1130V720H1050V660"/>

    <path d="M0 530H230V500H380"/>
    <path d="M1920 550H1690V580H1540"/>
    <path d="M500 0V180H580V260"/>
    <path d="M1420 1080V900H1340V820"/>
  </g>

  <!-- PULSOS DE ENERGÍA PRINCIPALES -->
  <g>
    <use href="#p1" class="energy-pulse"/>
    <use href="#p2" class="energy-pulse" style="animation-delay:-1.2s"/>
    <use href="#p3" class="energy-pulse" style="animation-delay:-2.4s"/>
    <use href="#p4" class="energy-pulse" style="animation-delay:-3.6s"/>
    <use href="#p5" class="energy-pulse" style="animation-delay:-.8s"/>
    <use href="#p6" class="energy-pulse" style="animation-delay:-2s"/>
    <use href="#p7" class="energy-pulse" style="animation-delay:-3.2s"/>
    <use href="#p8" class="energy-pulse" style="animation-delay:-4.4s"/>
  </g>

  <!-- FLUJO SECUNDARIO -->
  <g class="energy-pulse-fast">
    <path d="M0 320H130V370H260V430H350"/>
    <path d="M1920 320H1790V370H1660V430H1570"/>
    <path d="M0 700H140V650H270V590H390"/>
    <path d="M1920 700H1780V650H1650V590H1530"/>
    <path d="M700 300H790V360H870V420"/>
    <path d="M1220 780H1130V720H1050V660"/>
  </g>

 



<!-- AETHER - ADVANCED ENERGY CORE -->

<defs>
    <radialGradient id="aetherSphere">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="12%" stop-color="#c8faff"/>
        <stop offset="30%" stop-color="#55d5ff"/>
        <stop offset="58%" stop-color="#087cff"/>
        <stop offset="82%" stop-color="#0345a5"/>
        <stop offset="100%" stop-color="#00132e"/>
    </radialGradient>

    <radialGradient id="aetherAura">
        <stop offset="0%" stop-color="#28aaff" stop-opacity=".65"/>
        <stop offset="55%" stop-color="#087cff" stop-opacity=".2"/>
        <stop offset="100%" stop-color="#087cff" stop-opacity="0"/>
    </radialGradient>

    <filter id="aetherGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <filter id="aetherStrongGlow" x="-150%" y="-150%" width="400%" height="400%">
        <feGaussianBlur stdDeviation="20" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
</defs>

<style>
    .aether-orbit-1,
    .aether-orbit-2,
    .aether-orbit-3,
    .aether-sphere,
    .aether-particles {
        transform-box: view-box;
        transform-origin: 50% 50%;
    }

    .aether-orbit-1 {
        animation: aetherRotate 22s linear infinite;
    }

    .aether-orbit-2 {
        animation: aetherRotateReverse 15s linear infinite;
    }

    .aether-orbit-3 {
        animation: aetherRotate 9s linear infinite;
    }

    .aether-sphere {
        animation: aetherPulse 3s ease-in-out infinite;
    }

    .aether-electric {
        stroke-dasharray: 12 18;
        animation: aetherElectric 1.5s linear infinite;
    }

    .aether-particles {
        animation: aetherRotateReverse 7s linear infinite;
    }

    @keyframes aetherRotate {
        to { transform: rotate(360deg); }
    }

    @keyframes aetherRotateReverse {
        to { transform: rotate(-360deg); }
    }

    @keyframes aetherPulse {
        0%, 100% { transform: scale(.94); }
        50% { transform: scale(1.06); }
    }

    @keyframes aetherElectric {
        to { stroke-dashoffset: -60; }
    }
</style>

<g id="aether-energy-core">

    <!-- AURA EXTERIOR -->
    <circle cx="960" cy="540" r="245"
            fill="url(#aetherAura)"
            filter="url(#aetherStrongGlow)"/>

    <!-- ANILLO EXTERIOR -->
    <g class="aether-orbit-1" fill="none">
        <circle cx="960" cy="540" r="190"
                stroke="#087cff" stroke-width="3"
                stroke-dasharray="55 18 8 18"
                filter="url(#aetherGlow)"/>

        <circle cx="960" cy="540" r="210"
                stroke="#42caff" stroke-width="1.5"
                stroke-dasharray="3 16" opacity=".8"/>

        <path d="M 960 330 A 210 210 0 0 1 1170 540"
              stroke="#b5f2ff" stroke-width="3"
              filter="url(#aetherGlow)"/>

        <circle cx="960" cy="350" r="7"
                fill="#ffffff" filter="url(#aetherGlow)"/>
    </g>

    <!-- ANILLO INTERMEDIO -->
    <g class="aether-orbit-2" fill="none">
        <circle cx="960" cy="540" r="155"
                stroke="#168bff" stroke-width="4"
                stroke-dasharray="70 20 12 20"
                filter="url(#aetherGlow)"/>

        <circle cx="960" cy="540" r="135"
                stroke="#8ceaff" stroke-width="1.5"
                stroke-dasharray="4 12"/>

        <path d="M 825 540 A 135 135 0 0 1 960 405"
              stroke="#ffffff" stroke-width="3"
              filter="url(#aetherGlow)"/>
    </g>

    <!-- ANILLO INTERIOR -->
    <g class="aether-orbit-3" fill="none">
        <circle cx="960" cy="540" r="105"
                stroke="#55caff" stroke-width="2"
                stroke-dasharray="15 12"
                filter="url(#aetherGlow)"/>

        <circle cx="960" cy="435" r="5"
                fill="#ffffff" filter="url(#aetherGlow)"/>
    </g>

    <!-- DESCARGAS ELÉCTRICAS -->
    <g class="aether-electric"
       fill="none" stroke="#a5f4ff"
       stroke-width="3" stroke-linecap="round"
       filter="url(#aetherGlow)">

        <path d="M 960 345 L 980 380 L 950 410 L 982 445"/>
        <path d="M 1145 540 L 1110 520 L 1085 555 L 1050 535"/>
        <path d="M 960 735 L 940 700 L 970 670 L 945 635"/>
        <path d="M 775 540 L 815 560 L 840 525 L 875 545"/>
        <path d="M 830 410 L 865 435 L 845 465"/>
        <path d="M 1090 625 L 1060 600 L 1080 570"/>
    </g>

    <!-- PARTÍCULAS ORBITALES -->
    <g class="aether-particles" filter="url(#aetherGlow)">
        <circle cx="960" cy="320" r="5" fill="#ffffff"/>
        <circle cx="1180" cy="540" r="4" fill="#55caff"/>
        <circle cx="960" cy="760" r="5" fill="#ffffff"/>
        <circle cx="740" cy="540" r="4" fill="#55caff"/>
        <circle cx="805" cy="385" r="4" fill="#b5f2ff"/>
        <circle cx="1115" cy="695" r="4" fill="#b5f2ff"/>
    </g>

    <!-- ESFERA ENERGÉTICA -->
    <g class="aether-sphere">

        <circle cx="960" cy="540" r="100"
                fill="#087cff" opacity=".35"
                filter="url(#aetherStrongGlow)"/>

        <circle cx="960" cy="540" r="82"
                fill="url(#aetherSphere)"
                filter="url(#aetherGlow)"/>

        <!-- REFLEJO DE LUZ -->
        <ellipse cx="937" cy="510" rx="25" ry="13"
                 fill="#ffffff" opacity=".55"
                 filter="url(#aetherGlow)"/>

        <!-- CENTRO ULTRABRILLANTE -->
        <circle cx="960" cy="540" r="30"
                fill="#8ceaff" opacity=".4"
                filter="url(#aetherStrongGlow)"/>

               <circle cx="960" cy="540" r="12"
                fill="#ffffff"
                filter="url(#aetherStrongGlow)"/>

        <circle cx="960" cy="540" r="4"
                fill="#ffffff"/>
       </g>

</g>

</svg>
