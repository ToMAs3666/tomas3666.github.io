
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0750bb"/>
      <stop offset=".5" stop-color="#35aaff"/>
      <stop offset="1" stop-color="#0750bb"/>
    </linearGradient>

    <linearGradient id="chip" x2="0" y2="1">
      <stop stop-color="#102746"/>
      <stop offset="1" stop-color="#050d19"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <style>
    /* CIRCUITOS */
    .circuit-flow {
      opacity: .30;
    }

    /* ENERGÍA EN MOVIMIENTO */
    .energy-pulse {
      fill: none;
      stroke: url(#trace);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 110 890;
      stroke-dashoffset: 1000;
      filter: url(#glow);
      animation: energyFlow 8s linear infinite;
    }

    @keyframes energyFlow {
      0% { stroke-dashoffset: 1000; opacity: 0; }
      12% { opacity: 1; }
      85% { opacity: 1; }
      100% { stroke-dashoffset: -1000; opacity: 0; }
    }

    /* MICROCHIPS */
    .chip-energy {
      animation: chipPulse 4s ease-in-out infinite;
    }

    @keyframes chipPulse {
      0%, 100% {
        opacity: .55;
        filter: brightness(.85);
      }
      50% {
        opacity: 1;
        filter: brightness(1.7);
      }
    }

    /* CONTACTOS */
    .contact-energy {
      animation: contactPulse 3s ease-in-out infinite;
    }

    @keyframes contactPulse {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }

    /* LUZ AMBIENTAL */
    .ambient-energy {
      animation: ambientPulse 10s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { opacity: .035; }
      50% { opacity: .13; }
      100% { opacity: .055; }
    }

    /* PARTÍCULAS */
    .particle {
      fill: #72ceff;
      filter: url(#glow);
      animation: particlePulse 4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes particlePulse {
      0%, 100% {
        opacity: .15;
        transform: scale(.7);
      }
      50% {
        opacity: 1;
        transform: scale(1.5);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
    
/* =================================
   AETHER - INTENSE ENERGY SYSTEM
================================= */

/* Circuitos secundarios */
.secondary-circuits {
    fill: none;
    stroke: #168bff;
    stroke-width: 1.8;
    stroke-linecap: round;
    opacity: .55;
    filter: url(#glow);
}

/* Energía eléctrica */
.electric-flow {
    fill: none;
    stroke: #75d9ff;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-dasharray: 5 24;
    filter: url(#glow);
    animation: electricTravel 2.5s linear infinite;
}

@keyframes electricTravel {
    to {
        stroke-dashoffset: -116;
    }
}

/* Destellos */
.flash-point {
    fill: #a9eaff;
    filter: url(#glow);
    transform-box: fill-box;
    transform-origin: center;
    animation: flashPoint 2.2s ease-in-out infinite;
}

@keyframes flashPoint {
    0%, 100% {
        opacity: .15;
        transform: scale(.6);
    }
    45% {
        opacity: 1;
        transform: scale(2);
    }
    60% {
        opacity: .4;
    }
}

/* Iluminación intensa */
.intense-glow {
    fill: #087cff;
    filter: url(#softGlow);
    animation: intenseGlow 6s ease-in-out infinite alternate;
}

@keyframes intenseGlow {
    0% {
        opacity: .08;
    }
    50% {
        opacity: .28;
    }
    100% {
        opacity: .12;
    }
}

/* Partículas flotantes */
.floating-particle {
    fill: #66caff;
    filter: url(#glow);
    animation: floatingLight 5s ease-in-out infinite;
}

@keyframes floatingLight {
    0%, 100% {
        opacity: .1;
        transform: translateY(0);
    }
    50% {
        opacity: 1;
        transform: translateY(-16px);
    }
}

  </style>

  <!-- PROFUNDIDAD -->
  <g fill="none" stroke="#1675d5" opacity=".12" stroke-width="1">
    <path d="M0 80H300V160H420 M1920 90H1620V170H1500"/>
    <path d="M0 1000H300V920H420 M1920 990H1620V910H1500"/>
    <path d="M500 0V100H600V170 M1420 0V100H1320V170"/>
    <path d="M500 1080V980H600V910 M1420 1080V980H1320V910"/>
    <path d="M0 540H160V600H260 M1920 540H1760V600H1660"/>
  </g>

  <!-- PISTAS PRINCIPALES -->
  <g class="circuit-flow"
     fill="none"
     stroke="url(#trace)"
     stroke-width="2.5"
     stroke-linecap="round"
     stroke-linejoin="round">

    <path id="p1" pathLength="1000" d="M0 150H180V230H340V310H510V390H650"/>
    <path id="p2" pathLength="1000" d="M0 240H100V300H230V380H390"/>
    <path id="p3" pathLength="1000" d="M0 420H180V480H310V550H470"/>
    <path id="p4" pathLength="1000" d="M0 850H170V770H330V690H500V620H650"/>

    <path id="p5" pathLength="1000" d="M1920 150H1740V230H1580V310H1410V390H1270"/>
    <path id="p6" pathLength="1000" d="M1920 240H1820V300H1690V380H1530"/>
    <path id="p7" pathLength="1000" d="M1920 420H1740V480H1610V550H1450"/>
    <path id="p8" pathLength="1000" d="M1920 850H1750V770H1590V690H1420V620H1270"/>

    <path d="M300 0V130H390V210H500V280"/>
    <path d="M1620 0V130H1530V210H1420V280"/>
    <path d="M300 1080V950H390V870H500V800"/>
    <path d="M1620 1080V950H1530V870H1420V800"/>

    <path d="M650 0V100H730V190H800"/>
    <path d="M1270 0V100H1190V190H1120"/>
    <path d="M650 1080V980H730V890H800"/>
    <path d="M1270 1080V980H1190V890H1120"/>

    <path d="M180 230V340H260V410"/>
    <path d="M1740 230V340H1660V410"/>
    <path d="M330 690V600H410V540"/>
    <path d="M1590 690V600H1510V540"/>

    <path d="M510 390V460H600V510H700"/>
    <path d="M1410 390V460H1320V510H1220"/>
    <path d="M500 620V550H600V510"/>
    <path d="M1420 620V550H1320V510"/>
  </g>

<!-- AETHER - CIRCUITOS SECUNDARIOS -->
<g class="secondary-circuits">
    <path d="M0 320H130V370H260V430H350"/>
    <path d="M1920 320H1790V370H1660V430H1570"/>

    <path d="M0 700H140V650H270V590H390"/>
    <path d="M1920 700H1780V650H1650V590H1530"/>

    <path d="M420 0V70H520V130H590"/>
    <path d="M1500 0V70H1400V130H1330"/>

    <path d="M420 1080V1010H520V950H590"/>
    <path d="M1500 1080V1010H1400V950H1330"/>

    <path d="M800 0V90H860V150"/>
    <path d="M1120 0V90H1060V150"/>

    <path d="M800 1080V990H860V930"/>
    <path d="M1120 1080V990H1060V930"/>
</g>

<!-- FLUJO ELÉCTRICO SECUNDARIO -->
<g class="electric-flow">
    <path d="M0 320H130V370H260V430H350"/>
    <path d="M1920 320H1790V370H1660V430H1570"/>
    <path d="M0 700H140V650H270V590H390"/>
    <path d="M1920 700H1780V650H1650V590H1530"/>
</g>

  <!-- FLUJO DE ENERGÍA -->
  <g>
    <use href="#p1" class="energy-pulse"/>
    <use href="#p2" class="energy-pulse" style="animation-delay:-2s"/>
    <use href="#p3" class="energy-pulse" style="animation-delay:-4s"/>
    <use href="#p4" class="energy-pulse" style="animation-delay:-1s"/>
    <use href="#p5" class="energy-pulse" style="animation-delay:-3s"/>
    <use href="#p6" class="energy-pulse" style="animation-delay:-5s"/>
    <use href="#p7" class="energy-pulse" style="animation-delay:-2.5s"/>
    <use href="#p8" class="energy-pulse" style="animation-delay:-4.5s"/>
  </g>

  <!-- MICROCHIPS -->
  <g class="chip-energy" filter="url(#glow)">
    <g transform="translate(260 440)">
      <rect width="150" height="100" rx="9" fill="url(#chip)" stroke="#258bff" stroke-width="2"/>
      <rect x="14" y="14" width="122" height="72" rx="4" fill="none" stroke="#287cc8" opacity=".7"/>
      <path d="M30 35H120M30 50H120M30 65H120" stroke="#42baff" stroke-width="2" opacity=".7"/>
      <path d="M-18 20H0M-18 40H0M-18 60H0M-18 80H0 M150 20H168M150 40H168M150 60H168M150 80H168" stroke="#42aaff" stroke-width="3"/>
    </g>

    <g transform="translate(1510 440)">
      <rect width="150" height="100" rx="9" fill="url(#chip)" stroke="#258bff" stroke-width="2"/>
      <rect x="14" y="14" width="122" height="72" rx="4" fill="none" stroke="#287cc8" opacity=".7"/>
      <path d="M30 35H120M30 50H120M30 65H120" stroke="#42baff" stroke-width="2" opacity=".7"/>
      <path d="M-18 20H0M-18 40H0M-18 60H0M-18 80H0 M150 20H168M150 40H168M150 60H168M150 80H168" stroke="#42aaff" stroke-width="3"/>
    </g>
  </g>

  <!-- COMPONENTES -->
  <g fill="#07172b" stroke="#258bff" stroke-width="2" opacity=".9">
    <rect x="650" y="220" width="70" height="42" rx="5"/>
    <rect x="1200" y="220" width="70" height="42" rx="5"/>
    <rect x="650" y="820" width="70" height="42" rx="5"/>
    <rect x="1200" y="820" width="70" height="42" rx="5"/>
    <rect x="420" y="100" width="90" height="50" rx="5"/>
    <rect x="1410" y="100" width="90" height="50" rx="5"/>
  </g>

  <!-- CONTACTOS -->
  <g class="contact-energy" fill="#59c7ff" filter="url(#glow)">
    <circle cx="180" cy="150" r="5"/>
    <circle cx="340" cy="310" r="5"/>
    <circle cx="510" cy="390" r="5"/>
    <circle cx="100" cy="300" r="4"/>
    <circle cx="230" cy="380" r="4"/>
    <circle cx="170" cy="850" r="5"/>
    <circle cx="330" cy="690" r="5"/>
    <circle cx="500" cy="620" r="5"/>

    <circle cx="1740" cy="150" r="5"/>
    <circle cx="1580" cy="310" r="5"/>
    <circle cx="1410" cy="390" r="5"/>
    <circle cx="1820" cy="300" r="4"/>
    <circle cx="1690" cy="380" r="4"/>
    <circle cx="1750" cy="850" r="5"/>
    <circle cx="1590" cy="690" r="5"/>
    <circle cx="1420" cy="620" r="5"/>

    <circle cx="300" cy="130" r="4"/>
    <circle cx="1620" cy="130" r="4"/>
    <circle cx="300" cy="950" r="4"/>
    <circle cx="1620" cy="950" r="4"/>
  </g>

  <!-- PARTÍCULAS -->
  <g>
    <circle class="particle" cx="570" cy="260" r="3"/>
    <circle class="particle" cx="1350" cy="260" r="3" style="animation-delay:-1.5s"/>
    <circle class="particle" cx="740" cy="700" r="2.5" style="animation-delay:-2.5s"/>
    <circle class="particle" cx="1180" cy="700" r="2.5" style="animation-delay:-.8s"/>
    <circle class="particle" cx="950" cy="180" r="2" style="animation-delay:-3s"/>
    <circle class="particle" cx="960" cy="900" r="3" style="animation-delay:-1s"/>
  </g>

<!-- AETHER - INTENSE LIGHT SYSTEM -->

<g class="intense-glow">
    <circle cx="250" cy="300" r="95"/>
    <circle cx="1670" cy="300" r="95"/>
    <circle cx="300" cy="750" r="100"/>
    <circle cx="1620" cy="750" r="100"/>
    <circle cx="960" cy="540" r="180"/>
</g>

<!-- DESTELLOS ELÉCTRICOS -->
<g>
    <circle class="flash-point" cx="180" cy="230" r="4"/>
    <circle class="flash-point" cx="510" cy="390" r="4"
            style="animation-delay:-1s"/>
    <circle class="flash-point" cx="330" cy="690" r="4"
            style="animation-delay:-1.5s"/>
    <circle class="flash-point" cx="1740" cy="230" r="4"
            style="animation-delay:-.7s"/>
    <circle class="flash-point" cx="1410" cy="390" r="4"
            style="animation-delay:-1.8s"/>
    <circle class="flash-point" cx="1590" cy="690" r="4"
            style="animation-delay:-.4s"/>
    <circle class="flash-point" cx="960" cy="180" r="3"
            style="animation-delay:-1.2s"/>
    <circle class="flash-point" cx="960" cy="900" r="3"
            style="animation-delay:-2s"/>
</g>

<!-- PARTÍCULAS FLOTANTES -->
<g>
    <circle class="floating-particle" cx="600" cy="330" r="3"/>
    <circle class="floating-particle" cx="1320" cy="350" r="3"
            style="animation-delay:-2s"/>
    <circle class="floating-particle" cx="750" cy="800" r="2.5"
            style="animation-delay:-1s"/>
    <circle class="floating-particle" cx="1170" cy="780" r="3"
            style="animation-delay:-3s"/>
</g>

  <!-- LUZ AMBIENTAL -->
  <g class="ambient-energy" fill="#147bff" filter="url(#softGlow)">
    <circle cx="250" cy="300" r="65"/>
    <circle cx="1670" cy="300" r="65"/>
    <circle cx="300" cy="750" r="70"/>
    <circle cx="1620" cy="750" r="70"/>
    <circle cx="960" cy="540" r="120"/>
  </g>
</svg>
