
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1264ff"/>
      <stop offset="50%" stop-color="#54c5ff"/>
      <stop offset="100%" stop-color="#1264ff"/>
    </linearGradient>
  </defs>

  <!-- Circuitos principales -->
  <g fill="none" stroke="url(#trace)" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round" opacity=".8">

    <path d="M0 100 H180 V180 H300 V260 H450 V340 H570"/>
    <path d="M180 180 V100 H260 V40"/>
    <path d="M300 260 H380 V210 H460"/>
    <path d="M450 340 V420 H540 V470 H650"/>

    <path d="M1600 100 H1420 V180 H1300 V260 H1150 V340 H1030"/>
    <path d="M1420 180 V100 H1340 V40"/>
    <path d="M1300 260 H1220 V210 H1140"/>
    <path d="M1150 340 V420 H1060 V470 H950"/>

    <path d="M0 760 H170 V680 H300 V600 H450 V530 H570"/>
    <path d="M170 680 V780 H260 V850"/>
    <path d="M300 600 H380 V650 H460"/>
    <path d="M450 530 V460 H540 V420 H650"/>

    <path d="M1600 760 H1430 V680 H1300 V600 H1150 V530 H1030"/>
    <path d="M1430 680 V780 H1340 V850"/>
    <path d="M1300 600 H1220 V650 H1140"/>
    <path d="M1150 530 V460 H1060 V420 H950"/>

    <path d="M650 0 V120 H720 V220 H800"/>
    <path d="M950 0 V120 H880 V220 H800"/>
    <path d="M650 900 V780 H720 V680 H800"/>
    <path d="M950 900 V780 H880 V680 H800"/>

    <path d="M0 400 H180 V450 H300"/>
    <path d="M1600 400 H1420 V450 H1300"/>
  </g>

  <!-- Chips -->
  <g fill="#07152b" stroke="#258bff" stroke-width="2" filter="url(#glow)">
    <rect x="730" y="350" width="140" height="140" rx="12"/>
    <rect x="250" y="390" width="90" height="65" rx="7"/>
    <rect x="1260" y="390" width="90" height="65" rx="7"/>
    <rect x="700" y="90" width="70" height="45" rx="6"/>
    <rect x="830" y="765" width="70" height="45" rx="6"/>
  </g>

  <!-- Chip details -->
  <g fill="none" stroke="#54baff" stroke-width="2" opacity=".8">
    <path d="M760 380 H840 M760 400 H840 M760 420 H840 M760 440 H840"/>
    <path d="M760 460 H840"/>
    <path d="M715 365 V475 M885 365 V475"/>
    <path d="M730 330 V350 M760 330 V350 M790 330 V350 M820 330 V350 M850 330 V350"/>
    <path d="M730 490 V510 M760 490 V510 M790 490 V510 M820 490 V510 M850 490 V510"/>
  </g>

  <!-- Conexiones luminosas -->
  <g fill="#63c5ff" filter="url(#glow)">
    <circle cx="180" cy="100" r="5"/>
    <circle cx="300" cy="260" r="5"/>
    <circle cx="450" cy="340" r="5"/>
    <circle cx="1420" cy="100" r="5"/>
    <circle cx="1300" cy="260" r="5"/>
    <circle cx="1150" cy="340" r="5"/>
    <circle cx="170" cy="760" r="5"/>
    <circle cx="300" cy="600" r="5"/>
    <circle cx="1430" cy="760" r="5"/>
    <circle cx="1300" cy="600" r="5"/>
    <circle cx="800" cy="350" r="6"/>
    <circle cx="800" cy="490" r="6"/>
    <circle cx="700" cy="112" r="4"/>
    <circle cx="900" cy="787" r="4"/>
  </g>

  <!-- Pequeñas pistas de conexión -->
  <g fill="none" stroke="#278cff" stroke-width="1" opacity=".45">
    <path d="M40 40 H120 V70 H150"/>
    <path d="M1560 40 H1480 V70 H1450"/>
    <path d="M40 860 H120 V830 H150"/>
    <path d="M1560 860 H1480 V830 H1450"/>
    <path d="M520 100 H580 V150 H620"/>
    <path d="M1080 100 H1020 V150 H980"/>
    <path d="M520 800 H580 V750 H620"/>
    <path d="M1080 800 H1020 V750 H980"/>
