
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0750bb"/>
      <stop offset=".5" stop-color="#35aaff"/>
      <stop offset="1" stop-color="#0750bb"/>
    </linearGradient>

    <linearGradient id="chip" x2="0" y2="1">
      <stop stop-color="#102746"/>
      <stop offset="1" stop-color="#050d19"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Fondo de profundidad -->
  <g fill="none" stroke="#1675d5" opacity=".12" stroke-width="1">
    <path d="M0 80H300V160H420 M1920 90H1620V170H1500"/>
    <path d="M0 1000H300V920H420 M1920 990H1620V910H1500"/>
    <path d="M500 0V100H600V170 M1420 0V100H1320V170"/>
    <path d="M500 1080V980H600V910 M1420 1080V980H1320V910"/>
  </g>

  <!-- Pistas principales -->
  <g fill="none" stroke="url(#trace)" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round" opacity=".65">

    <path id="p1" d="M0 150H180V230H340V310H510V390H650"/>
    <path id="p2" d="M0 240H100V300H230V380H390"/>
    <path id="p3" d="M0 420H180V480H310V550H470"/>
    <path id="p4" d="M0 850H170V770H330V690H500V620H650"/>

    <path id="p5" d="M1920 150H1740V230H1580V310H1410V390H1270"/>
    <path id="p6" d="M1920 240H1820V300H1690V380H1530"/>
    <path id="p7" d="M1920 420H1740V480H1610V550H1450"/>
    <path id="p8" d="M1920 850H1750V770H1590V690H1420V620H1270"/>

    <path d="M300 0V130H390V210H500V280"/>
    <path d="M1620 0V130H1530V210H1420V280"/>
    <path d="M300 1080V950H390V870H500V800"/>
    <path d="M1620 1080V950H1530V870H1420V800"/>

    <path d="M650 0V100H730V190H800"/>
    <path d="M1270 0V100H1190V190H1120"/>
    <path d="M650 1080V980H730V890H800"/>
    <path d="M1270 1080V980H1190V890H1120"/>

    <path d="M180 230V340H260V410"/>
    <path d="M1740 230V340H1660V410"/>
    <path d="M330 690V600H410V540"/>
    <path d="M1590 690V600H1510V540"/>

    <path d="M510 390V460H600V510H700"/>
    <path d="M1410 390V460H1320V510H1220"/>
    <path d="M500 620V550H600V510"/>
    <path d="M1420 620V550H1320V510"/>
  </g>

  <!-- Microchips laterales -->
  <g filter="url(#glow)">
    <g transform="translate(260 440)">
      <rect width="150" height="100" rx="9" fill="url(#chip)"
            stroke="#258bff" stroke-width="2"/>
      <rect x="14" y="14" width="122" height="72" rx="4"
            fill="none" stroke="#287cc8" opacity=".7"/>
      <path d="M30 35H120M30 50H120M30 65H120"
            stroke="#42baff" stroke-width="2" opacity=".7"/>
      <path d="M-18 20H0M-18 40H0M-18 60H0M-18 80H0
               M150 20H168M150 40H168M150 60H168M150 80H168"
            stroke="#42aaff" stroke-width="3"/>
    </g>

    <g transform="translate(1510 440)">
      <rect width="150" height="100" rx="9" fill="url(#chip)"
            stroke="#258bff" stroke-width="2"/>
      <rect x="14" y="14" width="122" height="72" rx="4"
            fill="none" stroke="#287cc8" opacity=".7"/>
      <path d="M30 35H120M30 50H120M30 65H120"
            stroke="#42baff" stroke-width="2" opacity=".7"/>
      <path d="M-18 20H0M-18 40H0M-18 60H0M-18 80H0
               M150 20H168M150 40H168M150 60H168M150 80H168"
            stroke="#42aaff" stroke-width="3"/>
    </g>
  </g>

  <!-- Componentes pequeños -->
  <g fill="#07172b" stroke="#258bff" stroke-width="2" opacity=".9">
    <rect x="650" y="220" width="70" height="42" rx="5"/>
    <rect x="1200" y="220" width="70" height="42" rx="5"/>
    <rect x="650" y="820" width="70" height="42" rx="5"/>
    <rect x="1200" y="820" width="70" height="42" rx="5"/>
    <rect x="420" y="100" width="90" height="50" rx="5"/>
    <rect x="1410" y="100" width="90" height="50" rx="5"/>
  </g>

  <!-- Contactos -->
  <g fill="#59c7ff" filter="url(#glow)">
    <circle cx="180" cy="150" r="5"/>
    <circle cx="340" cy="310" r="5"/>
    <circle cx="510" cy="390" r="5"/>
    <circle cx="100" cy="300" r="4"/>
    <circle cx="230" cy="380" r="4"/>
    <circle cx="170" cy="850" r="5"/>
    <circle cx="330" cy="690" r="5"/>
    <circle cx="500" cy="620" r="5"/>

    <circle cx="1740" cy="150" r="5"/>
    <circle cx="1580" cy="310" r="5"/>
    <circle cx="1410" cy="390" r="5"/>
    <circle cx="1820" cy="300" r="4"/>
    <circle cx="1690" cy="380" r="4"/>
    <circle cx="1750" cy="850" r="5"/>
    <circle cx="1590" cy="690" r="5"/>
    <circle cx="1420" cy="620" r="5"/>

    <circle cx="300" cy="130" r="4"/>
    <circle cx="1620" cy="130" r="4"/>
    <circle cx="300" cy="950" r="4"/>
    <circle cx="1620" cy="950" r="4"/>
  </g>
  
  <!-- Luces con bucle continuo y reinicio invisible -->
  <g fill="#b7edff" filter="url(#glow)">

    <!-- Circuito superior izquierdo -->
    <circle r="5">
      <animateMotion dur="7s" repeatCount="indefinite">
        <mpath href="#p1"/>
      </animateMotion>
      <animate attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.12;0.82;1"
        dur="7s" repeatCount="indefinite"/>
    </circle>

    <circle r="4">
      <animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite">
        <mpath href="#p1"/>
      </animateMotion>
      <animate attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.12;0.82;1"
        dur="7s" begin="-3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Circuito inferior izquierdo -->
    <circle r="5">
      <animateMotion dur="9s" repeatCount="indefinite">
        <mpath href="#p4"/>
      </animateMotion>
      <animate attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.12;0.82;1"
        dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Circuito superior derecho -->
    <circle r="5">
      <animateMotion dur="8s" repeatCount="indefinite">
        <mpath href="#p5"/>
      </animateMotion>
      <animate attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.12;0.82;1"
        dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Circuito inferior derecho -->
    <circle r="5">
      <animateMotion dur="10s" repeatCount="indefinite">
        <mpath href="#p8"/>
      </animateMotion>
      <animate attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.12;0.82;1"
        dur="10s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Resplandor ambiental -->
  <g fill="#147bff" opacity=".12" filter="url(#softGlow)">
    <circle cx="250" cy="300" r="65"/>
    <circle cx="1670" cy="300" r="65"/>
    <circle cx="300" cy="750" r="70"/>
    <circle cx="1620" cy="750" r="70"/>
  </g>
</svg>
